{
  "name": "Español",
  "description": "Informa de un error o comparte un resultado de compatibilidad.",
  "title": "[Report] ",
  "body": [
    {
      "type": "dropdown",
      "id": "report_type",
      "attributes": {
        "label": "Tipo de informe",
        "options": [
          "Error",
          "Compatibilidad"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "Versión de TurboKiller",
        "placeholder": "1.2.0"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "mac",
      "attributes": {
        "label": "Modelo de Mac",
        "placeholder": "MacBookPro16,1"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "cpu",
      "attributes": {
        "label": "CPU",
        "placeholder": "Intel Core i7"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "macos",
      "attributes": {
        "label": "Versión de macOS",
        "placeholder": "macOS 15.7"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "sip",
      "attributes": {
        "label": "Protección de integridad del sistema (SIP)",
        "options": [
          "Activada",
          "Desactivada",
          "No lo sé"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "compatibility_result",
      "attributes": {
        "label": "Compatibilidad",
        "options": [
          "No corresponde — error",
          "Funciona",
          "Funciona parcialmente",
          "No funciona"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "details",
      "attributes": {
        "label": "Detalles y comportamiento esperado"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "steps",
      "attributes": {
        "label": "Pasos para reproducir (si corresponde)"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "logs",
      "attributes": {
        "label": "Error completo, registros o capturas"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "checkboxes",
      "id": "checks",
      "attributes": {
        "label": "Comprobaciones",
        "options": [
          {
            "label": "Este informe corresponde a un Mac con Intel.",
            "required": true
          },
          {
            "label": "Probé la versión oficial o una compilación sin modificar de este repositorio.",
            "required": true
          },
          {
            "label": "Revisé los informes existentes sobre el mismo problema.",
            "required": true
          }
        ]
      },
      "validations": {
        "required": false
      }
    }
  ]
}
