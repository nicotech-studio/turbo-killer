{
  "name": "Русский",
  "description": "Сообщите об ошибке или поделитесь результатом проверки совместимости.",
  "title": "[Report] ",
  "body": [
    {
      "type": "dropdown",
      "id": "report_type",
      "attributes": {
        "label": "Тип сообщения",
        "options": [
          "Ошибка",
          "Совместимость"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "Версия TurboKiller",
        "placeholder": "1.2.0"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "mac",
      "attributes": {
        "label": "Модель Mac",
        "placeholder": "MacBookPro16,1"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "cpu",
      "attributes": {
        "label": "Процессор",
        "placeholder": "Intel Core i7"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "macos",
      "attributes": {
        "label": "Версия macOS",
        "placeholder": "macOS 15.7"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "sip",
      "attributes": {
        "label": "Защита целостности системы (SIP)",
        "options": [
          "Включена",
          "Отключена",
          "Не знаю"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "compatibility_result",
      "attributes": {
        "label": "Совместимость",
        "options": [
          "Не относится — ошибка",
          "Работает",
          "Работает частично",
          "Не работает"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "details",
      "attributes": {
        "label": "Подробности и ожидаемое поведение"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "steps",
      "attributes": {
        "label": "Шаги воспроизведения (если применимо)"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "logs",
      "attributes": {
        "label": "Полная ошибка, журналы или снимки экрана"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "checkboxes",
      "id": "checks",
      "attributes": {
        "label": "Проверки",
        "options": [
          {
            "label": "Сообщение относится к Mac с Intel.",
            "required": true
          },
          {
            "label": "Проверена официальная версия или неизменённая сборка из этого репозитория.",
            "required": true
          },
          {
            "label": "Я проверил существующие сообщения о той же проблеме.",
            "required": true
          }
        ]
      },
      "validations": {
        "required": false
      }
    }
  ]
}
